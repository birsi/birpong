<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birpong match result</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#27d17f}a:hover{color:#ffffff}
th,td{padding:9px 12px;text-align:right;border-top:1px solid #3f3f46}
th:first-child{text-align:left}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 24px 48px; background: linear-gradient(#000000, #323232); color: #d4d4d8; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span style="font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 0.04em; color: #ffffff">BIRPONG</span>
<span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid #71717a; border-radius: 3px; padding: 3px 8px">Solo · CPU medium</span>
</header>

<section style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<h1 style="margin: 0; font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(44px, 9vw, 88px); line-height: 1; letter-spacing: 0.04em; color: #27d17f">YOU WIN</h1>
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-size: 44px; line-height: 1; color: #ffffff">10 : 7</span>
<span style="font-size: 12px">cups sunk</span>
</div>
</section>

<svg viewBox="0 0 240 60" role="img" aria-label="Final table: three of your cups left, none of the CPU cups left" style="display: block; width: 100%; height: auto">
<rect x="0.6" y="0.6" width="238.8" height="58.8" rx="1.6" fill="#000000" stroke="#d4d4d8" stroke-width="0.6"></rect>
<line x1="60" y1="1" x2="60" y2="59" stroke="#3f3f46" stroke-width="0.4"></line>
<line x1="120" y1="1" x2="120" y2="59" stroke="#3f3f46" stroke-width="0.4"></line>
<line x1="180" y1="1" x2="180" y2="59" stroke="#3f3f46" stroke-width="0.4"></line>
<circle cx="120" cy="30" r="9" fill="#000000" stroke="#71717a" stroke-width="0.4"></circle>
<polygon points="2.2,6.15 2.2,53.85 43.5,30" fill="none" stroke="#71717a" stroke-width="0.4" stroke-linejoin="round"></polygon>
<polygon points="237.8,6.15 237.8,53.85 196.5,30" fill="none" stroke="#71717a" stroke-width="0.4" stroke-linejoin="round"></polygon>
<g fill="#27272a" stroke="#ffffff" stroke-width="0.8">
<circle cx="23.93" cy="25.4" r="4.1"></circle>
<circle cx="23.93" cy="34.6" r="4.1"></circle>
<circle cx="31.9" cy="30" r="4.1"></circle>
</g>
<circle cx="208.1" cy="30" r="4.1" fill="none" stroke="#71717a" stroke-width="0.3" stroke-dasharray="1 1"></circle>
</svg>

<div style="overflow-x: auto; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px">
<table style="width: 100%; min-width: 420px; border-collapse: collapse; font-size: 14px">
<thead>
<tr>
<th scope="col" style="border-top: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase">Match</th>
<th scope="col" style="border-top: 0; color: #ffffff">birsi</th>
<th scope="col" style="border-top: 0; color: #ffffff">CPU</th>
</tr>
</thead>
<tbody>
<tr><th scope="row" style="font-weight: 400">Throws</th><td style="color: #ffffff">24</td><td style="color: #ffffff">22</td></tr>
<tr><th scope="row" style="font-weight: 400">Hits</th><td style="color: #ffffff">9</td><td style="color: #ffffff">7</td></tr>
<tr><th scope="row" style="font-weight: 400">Hit rate</th><td style="color: #ffffff">38%</td><td style="color: #ffffff">32%</td></tr>
<tr><th scope="row" style="font-weight: 400">Bounce hits</th><td style="color: #ffffff">1</td><td style="color: #ffffff">0</td></tr>
<tr><th scope="row" style="font-weight: 400">Balls back</th><td style="color: #ffffff">1</td><td style="color: #ffffff">0</td></tr>
<tr><th scope="row" style="font-weight: 400">Best streak</th><td style="color: #ffffff">3</td><td style="color: #ffffff">2</td></tr>
</tbody>
</table>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<p style="margin: 0; flex: 1 1 280px; font-size: 13px">Saved to your stats on this device.</p>
<nav style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="home.html" style="min-height: 48px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; color: #ffffff; border: 1px solid #71717a; border-radius: 4px; text-decoration: none">Home</a>
<a href="stats.html" style="min-height: 48px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; color: #ffffff; border: 1px solid #71717a; border-radius: 4px; text-decoration: none">Stats</a>
<a href="first-throw.html" style="min-height: 48px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; background: #27d17f; color: #000000; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none">Rematch</a>
</nav>
</div>

</div>
</div>
</body>
</html>
