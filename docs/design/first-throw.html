<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birpong solo first throw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Silkscreen:wght@400;700&amp;display=swap">
<style>
body{margin:0}
button,input{font:inherit}
a{color:#27d17f}a:hover{color:#ffffff}
</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 24px 48px; background: linear-gradient(#000000, #323232); color: #d4d4d8; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; align-items: center">
<div style="width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span style="font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 0.04em; color: #ffffff">BIRPONG</span>
<span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid #71717a; border-radius: 3px; padding: 3px 8px">Solo · CPU medium</span>
</div>
<a href="home.html" style="min-height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; color: #ffffff; border: 1px solid #71717a; border-radius: 4px; text-decoration: none">Back</a>
</header>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(30px, 6vw, 56px); line-height: 1.05; letter-spacing: 0.04em; color: #ffffff">WHO THROWS FIRST</h1>
<p style="margin: 0">Rock, paper, scissors. Best of one. A tie is replayed.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px">

<section style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #000000; background: #27d17f; padding: 2px 6px; border-radius: 3px">YOU</span>
<span style="font-size: 16px; font-weight: 500; color: #ffffff">birsi</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" aria-pressed="true" style="flex: 1 1 96px; min-height: 72px; background: #3f3f46; color: #ffffff; border: 1px solid #27d17f; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer">ROCK</button>
<button type="button" aria-pressed="false" style="flex: 1 1 96px; min-height: 72px; background: transparent; color: #d4d4d8; border: 1px solid #71717a; border-radius: 4px; letter-spacing: 0.1em; cursor: pointer">PAPER</button>
<button type="button" aria-pressed="false" style="flex: 1 1 96px; min-height: 72px; background: transparent; color: #d4d4d8; border: 1px solid #71717a; border-radius: 4px; letter-spacing: 0.1em; cursor: pointer">SCISSORS</button>
</div>
</section>

<section style="flex: 1 1 260px; min-width: 0; box-sizing: border-box; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #000000; background: #ff9900; padding: 2px 6px; border-radius: 3px">CPU</span>
<span style="font-size: 16px; font-weight: 500; color: #ffffff">Medium</span>
</div>
<div style="min-height: 72px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid #ff9900; border-radius: 4px; color: #ffffff; font-weight: 700; letter-spacing: 0.1em">SCISSORS</div>
</section>

</div>

<section style="box-sizing: border-box; border: 1px solid #27d17f; border-radius: 6px; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Silkscreen', 'JetBrains Mono', monospace; font-size: 28px; line-height: 1; letter-spacing: 0.06em; color: #27d17f">YOU THROW FIRST</span>
<p style="margin: 0; font-size: 13px">Rock beats scissors. CPU gets the re-roll at the end.</p>
</div>
<a href="match.html" style="min-height: 52px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: center; background: #27d17f; color: #000000; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none">Start match</a>
</section>

</div>
</div>
</body>
</html>
